# &.edu LAB on a server: `docker compose up -d --build`, then open http://<server>:8090
services:
  lab:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file: .env                 # api_KEY=..., optional SCIEDU_PLANNER_MODELS / SCIEDU_LESSON_MODELS
    environment:
      SCIEDU_AUTH: "1"             # every student signs in; courses are private to their owner
      # the hostnames students type in the address bar (anything else is rejected)
      SCIEDU_ALLOWED_HOSTS: "lab.example.edu,192.168.1.50"
      AGY_CLI: "0"                 # never let uploaded documents drive an agent on a shared server
    volumes:
      - ./content:/app/content     # SQLite database, lessons and notes survive rebuilds
