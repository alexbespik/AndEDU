<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SciEdu Studio — Scientific Notations & Interactive Physics IDE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body, html {
        height: 100%;
        width: 100%;
        background-color: #121212;
        color: #f8f8f2;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      
      /* Subtle Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #141414;
      }
      ::-webkit-scrollbar-thumb {
        background: #282828;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #e5b85c;
      }

      /* KaTeX Custom Theming */
      .katex {
        font-size: 1.08em;
        color: #f8f8f2;
      }
      .katex-display {
        overflow-x: auto;
        overflow-y: hidden;
        padding: 12px 16px;
        margin: 16px 0;
        background: rgba(22, 22, 22, 0.95);
        border: 1px solid #333333;
        border-left: 3px solid #23a55a;
        border-radius: 6px;
        scrollbar-width: thin;
      }
      .katex-display > .katex {
        text-align: center;
        display: block;
      }
      .katex .mathnormal {
        color: #e5b85c; /* Luminous Pine Gold */
      }
      .katex .mord {
        color: #f0fdf4; /* Crisp white */
      }
      .katex .mbin, .katex .mrel {
        color: #2ecc71; /* Lush Forest Green */
      }
      .katex .mopen, .katex .mclose {
        color: #e5b85c; /* Gold Delimiters */
      }
      .katex .minner {
        color: #66d9ef; /* Alpine Lake Cyan */
      }

      /* Markdown Content Styling */
      .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
        color: #f8f8f2;
        font-family: 'JetBrains Mono', monospace;
        margin-top: 1.4em;
        margin-bottom: 0.6em;
        font-weight: 700;
      }
      .markdown-body h1 { font-size: 1.7rem; border-bottom: 1px solid #282828; padding-bottom: 8px; }
      .markdown-body h2 { font-size: 1.35rem; border-bottom: 1px dashed #282828; padding-bottom: 6px; }
      .markdown-body h3 { font-size: 1.15rem; color: #e5b85c; }
      .markdown-body p {
        margin-bottom: 1em;
        line-height: 1.7;
        color: #d1d5db;
      }
      .markdown-body ul, .markdown-body ol {
        margin-left: 1.5em;
        margin-bottom: 1em;
        line-height: 1.68;
        color: #d1d5db;
      }
      .markdown-body li {
        margin-bottom: 0.4em;
      }
      .markdown-body blockquote {
        margin: 1.2em 0;
        padding: 10px 16px;
        background: #181c18;
        border-left: 4px solid #23a55a;
        border-radius: 0 6px 6px 0;
        color: #d1d5db;
      }
      .markdown-body code {
        background: #1e1e1e;
        color: #e5b85c;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.9em;
      }
      .markdown-body pre {
        background: #0d0d0d;
        border: 1px solid #282828;
        border-radius: 6px;
        padding: 14px;
        overflow-x: auto;
        margin: 1.2em 0;
      }
      .markdown-body pre code {
        background: transparent;
        padding: 0;
        color: #f8f8f2;
      }
      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.2em 0;
      }
      .markdown-body th, .markdown-body td {
        border: 1px solid #282828;
        padding: 10px 14px;
        text-align: left;
      }
      .markdown-body th {
        background: #1a1a1a;
        color: #e5b85c;
        font-family: 'JetBrains Mono', monospace;
      }
      .markdown-body tr:nth-child(even) {
        background: #151515;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
